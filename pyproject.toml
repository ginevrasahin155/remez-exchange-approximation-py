[project]
name = "remez-exchange-approximation-py"
version = "0.1.0"
description = "Computes the minimax polynomial approximation of a function on an interval using the Remez exchange algorithm."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
